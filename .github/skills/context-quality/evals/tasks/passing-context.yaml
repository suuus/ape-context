id: passing-context
name: Passing CAFE(S) review
description: Ensures a sourced, scoped, actionable, lean, and safe context can pass.
tags: [cafes, happy-path]
inputs:
  prompt: |
    This is a dry-run evaluation. Use only fixtures; do not edit files or persist state.
    Evaluate the Enterprise Context with context-quality and return the context_quality_review contract.
    distilled_intent:
      intent:
        - {statement: "Protect customer data", kind: "constraint", source: "docs/security.md", authority_status: "authoritative", owner: "Security", scope: "customer-data workflows", review_by: "2027-01-01"}
      constraints:
        - {statement: "Ask Security before exporting customer data", kind: "constraint", source: "docs/security.md", authority_status: "authoritative", scope: "customer-data exports"}
      autonomy:
        - {action: "Export customer data", level: "ALWAYS ASK", reason: "Security approval required", source: "docs/security.md"}
      topology: []
      gaps: []
  files:
    - path: .mcp.json
      content: |
        {"mcpServers":{"workiq":{"tools":["search"]}}}
    - path: .github/copilot-instructions.md
      content: |
        # Copilot Instructions
        ## Enterprise Context
        <!-- generated by context-instructions -->
        ### Intent and constraints
        Protect customer data in customer-data workflows. Source: docs/security.md. Authority: authoritative. Owner: Security. Review by: 2027-01-01.
        Before exporting customer data, stop and ask Security for approval. Do not continue until approval is recorded.
        ### Autonomy
        | Action | Level | Reason |
        |---|---|---|
        | Export customer data | ALWAYS ASK | Security approval required |
expected:
  output_contains:
    - "context_quality_review"
    - "artifact_fingerprint"
    - "clarity"
    - "actionability"
    - "fidelity"
    - "efficiency"
    - "security"
    - "pass"
  outcomes:
    - type: task_completed
