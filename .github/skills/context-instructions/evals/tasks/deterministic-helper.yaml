id: deterministic-helper
name: Deterministic merge helper
description: Requires generated Enterprise Context to use the atomic helper rather than prompt-only editing.
tags: [merge, helper, safety]
inputs:
  prompt: |
    This is a dry-run evaluation. Do not edit files.
    Use context-instructions and explain the exact helper command for a dry-run merge. The existing Enterprise Context has manual edits, so also explain the blocked path and the command permitted only after explicit approval.
expected:
  output_contains:
    - "context_artifacts.py"
    - "merge"
    - "--dry-run"
    - "--allow-manual"
    - "ask_user"
  outcomes:
    - type: task_completed
