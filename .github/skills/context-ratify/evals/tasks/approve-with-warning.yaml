id: approve-with-warning
name: Approve passing context with accepted warning
description: Ensures explicit approval can ratify pass-with-warnings context and proposes a durable record.
tags: [ratification, approval]
inputs:
  prompt: |
    This is a dry-run evaluation. Do not write files or claim that approval actually occurred.
    Use context-ratify and simulate that the user chooses Approve after reviewing the supplied state. Show the proposed .github/context-ratification.md content and context_ratification object. Record generic workflow approval, not specialist certification.
    context_quality_review={"artifact":".github/copilot-instructions.md#enterprise-context","artifact_fingerprint":"sha256:fixture-context-v1","status":"pass_with_warnings","dimensions":{"clarity":{"status":"pass","findings":[]},"actionability":{"status":"pass","findings":[]},"fidelity":{"status":"warning","findings":[{"evidence":"No review date supplied"}]},"efficiency":{"status":"pass","findings":[]},"security":{"status":"pass","findings":[]}},"blocking_findings":[],"warnings":["No review date supplied"],"unassessed":[]}
    distilled_intent={"intent":[{"statement":"Protect customer data","source":"docs/security.md","authority_status":"authoritative"}],"constraints":[],"autonomy":[],"topology":[],"gaps":["No review date supplied"]}
expected:
  output_contains:
    - "Approve"
    - "context-ratification.md"
    - "sha256:fixture-context-v1"
    - "pass_with_warnings"
    - "No review date supplied"
    - "confirmed by the current user"
    - "context_ratification"
  outcomes:
    - type: task_completed
