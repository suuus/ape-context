name: context-ratify-eval
description: Tests passing-quality preconditions, explicit approval, revision routing, and durable ratification boundaries.
skill: context-ratify
version: "0.1"
config:
  trials_per_task: 1
  timeout_seconds: 180
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
  skill_directories:
    - ".."
  required_skills:
    - context-ratify
metrics:
  - name: accuracy
    weight: 1.0
    threshold: 0.8
graders:
  - type: code
    name: meaningful_output
    config:
      assertions:
        - "len(output.strip()) > 140"
  - type: text
    name: no_false_certification
    config:
      regex_not_match:
        - "(?i)(legally|security|compliance) certified"
  - type: text
    name: dry_run_safe
    config:
      regex_not_match:
        - "(?i)\\b(I|we)\\s+(wrote|created|committed|ratified)\\s+(the\\s+)?(real\\s+)?"
tasks:
  - "tasks/*.yaml"
