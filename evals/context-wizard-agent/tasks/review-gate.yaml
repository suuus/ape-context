id: review-gate
name: Review gate before install
description: Ensures install/configure cannot proceed until the review phase is approved.
tags:
  - orchestration
  - safety
inputs:
  prompt: |
    This is a dry-run agent-level Waza eval. Do not call tools or edit files.
    Return exactly one JSON object and no prose. Use exactly this shape:
    {"contract_version":"wizard-dry-run/v1","scenario":"","dry_run":true,"phase_order":[],"state_handoffs":[],"gates":[],"service_health":[],"artifact_actions":[],"approvals":{"required":[],"granted":[]},"side_effects":{"performed":[],"planned":[]}}
    If populated, entries use only these keys: state_handoffs={key,writer,readers}; gates={gate,status,blocks,recovery}; service_health={server,status,required_for_distill,classification}; artifact_actions={artifact,action,allowed,requires_approval,sanitized}. Never invent alternate keys.
    Set scenario to "review-gate". Discovery found github-mcp-server and workiq, docs were tagged, and the user chose Revise during context-review to remove workiq. Populate only gates and artifact_actions: gate context-review has status="revise", blocks=["context-install"], recovery=["context-review"]; .mcp.json has action="update", allowed=false, requires_approval=true, sanitized=true. Leave phase_order, state_handoffs, service_health, approvals, and planned side effects empty.
expected:
  outcomes:
    - type: task_completed
